{% extends 'base.html' %}
{% block content %}
<h2>Корзина</h2>
<table class="table">
    <thead>
        <tr>
            <th>Товар</th><th>Кол-во</th><th>Сумма</th><th></th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.get_total }} сом</td>
            <td><a href="{% url 'remove_from_cart' item.id %}" class="btn btn-sm btn-danger">Удалить</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<p><strong>Итого: {{ total }} сом</strong></p>
<a href="{% url 'checkout' %}" class="btn btn-primary">Оформить заказ</a>
{% endblock %}
