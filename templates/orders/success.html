{% extends 'base.html' %}

{% block title %}Спасибо за заказ{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h2 class="mt-3">🎉 Спасибо за ваш заказ!</h2>
        <p class="lead">Ваш заказ №<strong>{{ order.id }}</strong> успешно оформлен.</p>
        <p>Адрес доставки: <em>{{ order.address }}</em></p>
        <a href="{% url 'product_list' %}" class="btn btn-primary mt-4">Вернуться в магазин</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
