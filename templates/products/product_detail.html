{% extends 'base.html' %}
{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid rounded shadow-sm">
    </div>

    <div class="col-md-6">
        <h2 class="mb-3">{{ product.name }}</h2>
        <h4 class="text-success mb-4">💰 {{ product.price }} сом</h4>
        <p class="mb-4">{{ product.description }}</p>

        <form method="post" action="{% url 'cart_add' product.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-lg btn-success">🛒 Добавить в корзину</button>
        </form>

        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary mt-3">← Назад к каталогу</a>
    </div>
</div>
{% endblock %}
