{% extends 'base.html' %}

{% block title %}Вход - MyShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h4>Вход</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="Имя пользователя">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Пароль">
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Войти</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
